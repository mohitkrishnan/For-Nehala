<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Vave, Nehala</title>
    <style>
        :root { --rose: #ff4d6d; --gold: #ffb703; --dark: #0a0a0a; }
        body { background-color: var(--dark); color: white; font-family: 'Georgia', serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        .bg-hearts { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .card { background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(15px); padding: 40px 25px; border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; max-width: 400px; width: 85%; box-shadow: 0 25px 50px rgba(0,0,0,0.6); }
        .hidden { display: none !important; }
        h1 { font-size: 2.2rem; color: var(--rose); margin-bottom: 10px; }
        .btn-container { display: flex; justify-content: center; gap: 20px; margin-top: 35px; height: 65px; align-items: center; }
        button { padding: 14px 35px; border-radius: 35px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .yes-btn { background: var(--rose); color: white; }
        .no-btn { background: #2a2a2a; color: #999; }
        .polaroid { background: #fff; padding: 12px 12px 35px 12px; margin: 0 auto 25px auto; max-width: 250px; box-shadow: 0 20px 40px rgba(0,0,0,0.9); }
        .polaroid img { width: 100%; display: block; }
        .malayalam-text { font-size: 1.2rem; color: var(--gold); margin-top: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="bg-hearts" id="heart-bg"></div>

    <div id="page1" class="card">
        <div class="polaroid" style="transform: rotate(-4deg);">
            <img src="photo_2026-02-01_19-26-27.jpg" alt="Memory 1">
        </div>
        <h1>Hi Nehala...</h1>
        <p>Do you love me?</p>
        <div class="btn-container">
            <button class="yes-btn" onclick="showPage('page2')">Yes!</button>
            <button id="noBtn1" class="no-btn" onmouseover="dodge('noBtn1')">No</button>
        </div>
    </div>

    <div id="page2" class="card hidden">
        <div class="polaroid" style="transform: rotate(4deg);">
            <img src="second-photo.jpg" alt="Memory 2">
        </div>
        <h1>I knew it! ❤️</h1>
        <h2 style="color: var(--rose);">Will you be mine forever?</h2>
        <div class="malayalam-text">എന്നും കൂടെ ഉണ്ടാവില്ലേ?</div>
        <div class="btn-container">
            <button class="yes-btn" onclick="showPage('page3')">YES!</button>
            <button id="noBtn2" class="no-btn" onmouseover="dodge('noBtn2')">No</button>
        </div>
    </div>

    <div id="page3" class="card hidden">
        <h1 style="color: var(--rose);">I Love You, Vave!</h1>
        <div class="polaroid">
            <img src="second-photo.jpg" alt="Memory 2 Final">
        </div>
        <p style="font-style: italic; color: #fff;">"I Love you vave and I miss you so much"</p>
    </div>

    <script>
        function dodge(id) {
            const btn = document.getElementById(id);
            btn.style.position = 'fixed';
            btn.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            btn.style.top = Math.random() * (window.innerHeight - 50) + 'px';
        }

        function showPage(pageId) {
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.add('hidden');
            document.getElementById('page3').classList.add('hidden');
            document.getElementById(pageId).classList.remove('hidden');
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.style.position = 'fixed';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '100vh';
            heart.style.fontSize = '20px';
            heart.style.transition = 'transform 5s linear';
            document.getElementById('heart-bg').appendChild(heart);
            setTimeout(() => { heart.style.transform = 'translateY(-110vh)'; }, 100);
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 400);
    </script>
</body>
</html>
