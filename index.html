<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Vave, Nehala</title>
    <style>
        :root {
            --rose: #ff4d6d;
            --gold: #ffb703;
            --dark: #0a0a0a;
        }
        body {
            background-color: var(--dark);
            color: white;
            font-family: 'Georgia', serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .bg-hearts {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            padding: 40px 25px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 400px;
            width: 85%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            position: absolute;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hidden { display: none; opacity: 0; transform: scale(0.8) translateY(20px); }

        h1 { font-size: 2.2rem; color: var(--rose); margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,77,109,0.3); }
        p { font-size: 1.1rem; color: #ddd; line-height: 1.5; }

        .btn-container { display: flex; justify-content: center; gap: 20px; margin-top: 35px; height: 65px; align-items: center; }
        button { padding: 14px 35px; border-radius: 35px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        
        .yes-btn { background: var(--rose); color: white; box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4); }
        .no-btn { background: #2a2a2a; color: #999; }

        .polaroid {
            background: #fff;
            padding: 12px 12px 35px 12px;
            margin: 0 auto 25px auto;
            max-width: 260px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            transition: 0.5s;
        }
        .polaroid img { width: 100%; display: block; filter: contrast(1.1); }
        .rotate-left { transform: rotate(-4deg); }
        .rotate-right { transform: rotate(4deg); }

        .malayalam-text { font-size: 1.2rem; color: var(--gold); margin-top: 18px; font-weight: bold; }

        @keyframes finalPop { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div class="bg-hearts" id="heart-bg"></div>

    <div id="page1" class="card">
        <div class="polaroid rotate-left">
            <img src="photo_2026-02-01_19-26-27.jpg" alt="Photo 1">
        </div>
        <h1>Hi Nehala...</h1>
        <p>Do you love me?</p>
        <div class="btn-container">
            <button class="yes-btn" onclick="goToStep2()">Yes!</button>
            <button id="noBtn1" class="no-btn" onmouseover="dodge('noBtn1')">No</button>
        </div>
    </div>

    <div id="page2" class="card hidden">
        <div class="polaroid rotate-right">
            <img src="second-photo.jpg" alt="Photo 2">
        </div>
        <h1>I knew it! ❤️</h1>
        <p>Since it's February 8th...</p>
        <h2 style="color: var(--rose); font-size: 1.8rem;">Will you be mine forever?</h2>
        <div class="malayalam-text">എന്നും കൂടെ ഉണ്ടാവില്ലേ?</div>
        <div class="btn-container">
            <button class="yes-btn" onclick="goToStep3()">YES!</button>
            <button id="noBtn2" class="no-btn" onmouseover="dodge('noBtn2')">No</button>
        </div>
    </div>

    <div id="page3" class="card hidden" style="position: relative; animation: finalPop 0.8s ease-out forwards;">
        <h1 style="color: var(--rose);">I Love You, Vave!</h1>
        <div class="polaroid rotate-left">
            <img src="second-photo.jpg" alt="Photo 2">
        </div>
        <p style="font-style: italic; color: #fff;">"I Love you vave and I miss you so much"</p>
    </div>

    <script>
        function dodge(id) {
            const btn = document.getElementById(id);
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function goToStep2() {
            transitionCards('page1', 'page2');
        }

        function goToStep3() {
            transitionCards('page2', 'page3');
        }

        function transitionCards(hideId, showId) {
            const hide = document.getElementById(hideId);
            const show = document.getElementById(showId);
            hide.classList.add('hidden');
            setTimeout(() => {
                hide.style.display = 'none';
                show.style.display = 'block';
                setTimeout(() => show.classList.remove('hidden'), 50);
            }, 600);
        }

            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.style.position = 'fixed';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '100vh';

            heart.style.opacity = Math.random();
            heart.style.transition = `transform ${Math.random() * 2 + 4}s linear, opacity 5s`;

                heart.style.opacity = '0';
