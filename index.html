<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Vave, Nehala</title>
    <style>
        :root {
            --rose: #ff4d6d;
            --gold: #ffb703;
            --dark: #0f0f0f;
        }
        body {
            background-color: var(--dark);
            color: white;
            font-family: 'Georgia', serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .bg-hearts {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 30px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 400px;
            width: 85%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            position: absolute;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .hidden { display: none; opacity: 0; transform: scale(0.9); }

        h1 { font-size: 2rem; color: var(--rose); margin-bottom: 10px; }
        p { font-size: 1rem; color: #ccc; }

        .btn-container { display: flex; justify-content: center; gap: 20px; margin-top: 30px; height: 60px; align-items: center; }
        button { padding: 12px 30px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        
        .yes-btn { background: var(--rose); color: white; box-shadow: 0 0 15px var(--rose); }
        .no-btn { background: #333; color: #888; }

        /* Polaroid Style */
        .polaroid {
            background: white;
            padding: 10px 10px 30px 10px;
            margin: 0 auto 20px auto;
            max-width: 250px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
        }
        .polaroid img { width: 100%; display: block; filter: contrast(1.05); }
        .rotate-left { transform: rotate(-3deg); }
        .rotate-right { transform: rotate(3deg); }

        .malayalam-text { font-size: 1.1rem; color: var(--gold); margin-top: 15px; }

        @keyframes zoomIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div class="bg-hearts" id="heart-bg"></div>

    <div id="page1" class="card">
        <div class="polaroid rotate-left">
            <img src="photo_2026-02-01_19-26-27.jpg" alt="Our First Photo">
        </div>
        <h1>Hi Nehala...</h1>
        <p>Do you love me?</p>
        <div class="btn-container">
            <button class="yes-btn" onclick="goToProposal()">Yes!</button>
            <button id="noBtn1" class="no-btn" onmouseover="moveNo('noBtn1')">No</button>
        </div>
    </div>

    <div id="page2" class="card hidden">
        <h1>I knew it! ❤️</h1>
        <p>Since it's February 8th...</p>
        <h2 style="color: var(--rose);">Will you be mine forever?</h2>
        <div class="malayalam-text">എന്നും കൂടെ ഉണ്ടാവില്ലേ?</div>
        <div class="btn-container">
            <button class="yes-btn" onclick="showFinalReveal()">YES</button>
            <button id="noBtn2" class="no-btn" onmouseover="moveNo('noBtn2')">No</button>
        </div>
    </div>

    <div id="page3" class="card hidden" style="position: relative; animation: zoomIn 0.8s;">
        <h1 style="color: var(--rose);">I Love You, Vave!</h1>
        <div class="polaroid rotate-right">
            <img src="second-photo.jpg" alt="Our Proposal Moment">
        </div>
        <p style="font-style: italic; color: #ccc;">"I Love you vave and I miss you so much"</p>
        <div class="malayalam-text">Happy 1st Anniversary!</div>
    </div>

    <script>
        function moveNo(id) {
            const btn = document.getElementById(id);
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function goToProposal() {
            document.getElementById('page1').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('page1').style.display = 'none';
                document.getElementById('page2').style.display = 'block';
                setTimeout(() => document.getElementById('page2').classList.remove('hidden'), 50);
            }, 500);
        }

        function showFinalReveal() {
            document.getElementById('page2').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('page2').style.display = 'none';
                document.getElementById('page3').style.display = 'block';
                setTimeout(() => document.getElementById('page3').classList.remove('hidden'), 50);
            }, 500);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.style.position = 'fixed';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '100vh';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            heart.style.opacity = Math.random();
            heart.style.transition = 'transform 6s linear, opacity 6s';
            document.getElementById('heart-bg').appendChild(heart);
            setTimeout(() => {
                heart.style.transform = 'translateY(-110vh)';
                heart.style.opacity = '0';
            }, 100);
            setTimeout(() => { heart.remove(); }, 7000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
