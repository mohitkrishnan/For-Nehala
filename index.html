<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message for Nehala</title>
    <style>
        :root {
            --rose: #ff4d6d;
            --gold: #ffb703;
            --dark: #1a1a1a;
        }
        body {
            background-color: var(--dark);
            color: white;
            font-family: 'Georgia', serif;
            text-align: center;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container { padding: 20px; }
        h1 { font-size: 2.5rem; color: var(--rose); margin-bottom: 10px; }
        p { font-size: 1.2rem; color: #ccc; }
        
        /* The Question Box */
        #proposal-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 450px;
            margin: 20px auto;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            height: 80px;
            align-items: center;
        }

        button {
            padding: 15px 40px;
            border-radius: 50px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        #yesBtn { background: var(--rose); color: white; box-shadow: 0 0 20px rgba(255, 77, 109, 0.5); }
        #noBtn { background: #444; color: #bbb; position: relative; }

        /* Cinematic Reveal */
        #reveal { display: none; animation: fadeIn 3s ease-in-out; }
        .photo-reveal {
            max-width: 320px;
            margin: 30px auto;
            border: 5px solid white;
            transform: rotate(-3deg);
            box-shadow: 0 15px 50px rgba(0,0,0,0.8);
        }
        .photo-reveal img { width: 100%; display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div class="container" id="main-content">
        <div id="proposal-box">
            <h1>Nehala...</h1>
            <p>Every moment since our first date a year ago has led to this.</p>
            <h2 style="color: var(--gold);">Will you be mine forever?</h2>
            
            <div class="btn-group">
                <button id="yesBtn" onclick="proposeSuccess()">YES</button>
                <button id="noBtn" onmouseover="dodge()">NO</button>
            </div>
        </div>
    </div>

    <div id="reveal">
        <h1>I Love You, Vave! ❤️</h1>
        <div class="photo-reveal">
            <img src="photo_2026-02-01_19-26-27.jpg" alt="Our Moment">
        </div>
        <h2 style="color: var(--gold);">Happy February 8th!</h2>
        <p>You are my greatest adventure.</p>
    </div>

    <script>
        function dodge() {
            const btn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function proposeSuccess() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('reveal').style.display = 'block';
            // Start a confetti effect if you like!
        }
    </script>
</body>
</html>
