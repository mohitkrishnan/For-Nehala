<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Nehala</title>
    <style>
        :root { --rose: #ff4d6d; --gold: #ffb703; --dark: #0a0a0a; }
        
        * { box-sizing: border-box; }

        body { 
            background-color: var(--dark); 
            color: white; 
            font-family: 'Georgia', serif; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            position: fixed; /* Prevents scrolling on mobile */
        }
        
        #heart-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        .card { 
            background: rgba(255, 255, 255, 0.07); 
            backdrop-filter: blur(15px); 
            padding: 8vw; 
            border-radius: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            text-align: center; 
            width: 90%; 
            max-width: 350px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
            z-index: 10; 
            position: relative;
        }

        .hidden { display: none !important; }
        
        h1 { font-size: 1.8rem; color: var(--rose); margin: 0 0 10px 0; }
        p { font-size: 1.1rem; margin: 10px 0; }
        
        .btn-container { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            margin-top: 25px; 
            height: 60px; 
            align-items: center; 
        }
        
        button { 
            padding: 12px 25px; 
            border-radius: 25px; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 1rem; 
            z-index: 20;
            touch-action: manipulation; /* Optimizes for mobile taps */
        }

        .yes-btn { background: var(--rose); color: white; }
        .no-btn { background: #2a2a2a; color: #999; transition: 0.1s; }
        
        .polaroid { 
            background: #fff; 
            padding: 8px 8px 25px 8px; 
            margin: 0 auto 15px auto; 
            width: 100%;
            max-width: 220px; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.8); 
        }
        .polaroid img { width: 100%; height: auto; display: block; object-fit: cover; }
    </style>
</head>
<body>
    <div id="heart-bg"></div>

    <div id="page1" class="card">
        <div class="polaroid" style="transform: rotate(-3deg);">
            <img src="photo_2026-02-01_19-26-27.jpg" alt="Memory 1">
        </div>
        <h1>Hi Nehala...</h1>
        <p>Do you love me?</p>
        <div class="btn-container">
            <button class="yes-btn" onclick="showPage('page2')">Yes!</button>
            <button id="noBtn1" class="no-btn" onmouseover="dodge('noBtn1')" ontouchstart="dodge('noBtn1')">No</button>
        </div>
    </div>

    <div id="page2" class="card hidden">
        <div class="polaroid" style="transform: rotate(3deg);">
            <img src="second-photo.jpg" alt="Memory 2">
        </div>
        <h1>I knew it! ❤️</h1>
        <h2 style="color: var(--rose); font-size: 1.4rem;">Will you be mine forever?</h2>
        <p style="color: var(--gold); font-weight: bold;">എന്നും കൂടെ ഉണ്ടാവില്ലേ?</p>
        <div class="btn-container">
            <button class="yes-btn" onclick="showPage('page3')">YES!</button>
            <button id="noBtn2" class="no-btn" onmouseover="dodge('noBtn2')" ontouchstart="dodge('noBtn2')">No</button>
        </div>
    </div>

    <div id="page3" class="card hidden">
        <h1 style="color: var(--rose);">I Love You, Vave!</h1>
        <div class="polaroid">
            <img src="second-photo.jpg" alt="Memory 2 Final">
        </div>
        <p style="font-style: italic; color: #fff;">"I Love you vave and I miss you so much"</p>
    </div>
